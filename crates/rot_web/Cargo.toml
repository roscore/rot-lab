[package]
name = "rot_web"
description = "Browser UI for rot-lab (WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
rot_core = { path = "../rot_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "EventTarget", "Event",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlButtonElement",
  "HtmlOptionElement", "HtmlCanvasElement", "HtmlAnchorElement", "CanvasRenderingContext2d",
  "PointerEvent", "MouseEvent", "Storage", "History", "Location", "MediaQueryList",
  "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "DomTokenList", "DomRect",
  "TextMetrics", "console",
]
